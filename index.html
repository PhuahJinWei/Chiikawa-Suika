<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff3c2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="もちもちポン" />
    <title>もちもちポン!</title>
    <link rel="icon" href="/images/icons/icon_03usagi.png" type="image/png" />
    <link rel="apple-touch-icon" href="/images/icons/icon_03usagi.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
      rel="stylesheet"
      crossorigin
    />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <!--
      Phones: the two .side wrappers dissolve (display: contents) into one top bar above the
      cabinet, and the abilities become the cabinet's control tray. Wide screens: they are
      the panels left and right of the cabinet.
    -->
    <main class="game" id="game" aria-label="ゲーム">
      <div class="side side-left">
        <div class="scorebox" id="scorebox">
          <strong class="score" id="score" aria-label="スコア">0</strong>
          <span class="chip best-chip"><span>ベスト</span><b id="best">0</b></span>
        </div>
        <section class="chart" aria-labelledby="chart-title">
          <h2 class="chip chart-title" id="chart-title">なかま</h2>
          <ol class="friends" id="friends"></ol>
        </section>
      </div>
      <div class="cabinet" id="stage-wrap">
        <canvas id="stage" tabindex="-1" aria-label="ゲームばん"></canvas>
      </div>
      <div class="side side-right">
        <button class="next" id="btn-friends" type="button" aria-label="つぎ">
          <span class="next-bubble"><img id="next-img" alt="" /></span>
          <span class="chip">つぎ</span>
        </button>
        <section class="abilities" id="abilities" aria-label="とくぎ"></section>
        <button class="img-btn menu-btn" id="btn-menu" type="button" aria-label="メニュー"></button>
      </div>
    </main>

    <!-- タイトル -->
    <div class="screen title-screen open" id="screen-title" role="dialog" aria-label="タイトル">
      <div class="title-main">
        <h1 class="logo" id="logo"></h1>
        <!-- a little pile of friends in the bushes; tap one to surprise it -->
        <div class="hero" id="hero" aria-hidden="true">
          <i class="bush bush-1"></i>
          <i class="bush bush-2"></i>
        </div>
        <nav class="title-menu">
          <span class="chip best-chip" id="title-best" hidden><span>ベスト</span><b id="title-best-value">0</b></span>
          <button class="btn btn-pink btn-big" id="btn-continue" data-action="continue" type="button" hidden>つづきから</button>
          <button class="btn btn-pink btn-big" id="btn-play" data-action="play" type="button">あそぶ</button>
          <div class="title-icons" id="title-icons"></div>
        </nav>
      </div>
    </div>

    <!-- あそびかた -->
    <div class="overlay" id="screen-howto" role="dialog" aria-modal="true" aria-label="あそびかた">
      <div class="panel">
        <h2 class="ribbon">あそびかた</h2>
        <button class="img-btn close-btn" data-action="back" type="button" aria-label="とじる"></button>
        <div class="cards" id="howto-cards"></div>
        <div class="dots" id="howto-dots"></div>
        <button class="btn btn-pink" id="howto-next" type="button" data-autofocus>つぎへ</button>
      </div>
    </div>

    <!-- なかま -->
    <div class="overlay" id="screen-friends" role="dialog" aria-modal="true" aria-label="なかま">
      <div class="panel">
        <h2 class="ribbon">なかま</h2>
        <button class="img-btn close-btn" data-action="back" type="button" aria-label="とじる"></button>
        <ol class="collection" id="collection"></ol>
      </div>
    </div>

    <!-- せってい -->
    <div class="overlay" id="screen-settings" role="dialog" aria-modal="true" aria-label="せってい">
      <div class="panel">
        <h2 class="ribbon">せってい</h2>
        <button class="img-btn close-btn" data-action="back" type="button" aria-label="とじる"></button>
        <div class="settings">
          <label class="setting"><span>おと</span><input type="checkbox" id="set-sound" /><i class="switch"></i></label>
          <label class="setting"><span>おんがく</span><input type="checkbox" id="set-music" /><i class="switch"></i></label>
          <label class="setting"><span>おんりょう</span><input type="range" id="set-volume" min="0" max="1" step="0.05" /></label>
          <label class="setting"><span>かおを まっすぐ</span><input type="checkbox" id="set-upright" /><i class="switch"></i></label>
          <label class="setting"><span>ガイド</span><input type="checkbox" id="set-guide" /><i class="switch"></i></label>
          <label class="setting"><span>うごきを ひかえめに</span><input type="checkbox" id="set-motion" /><i class="switch"></i></label>
        </div>
        <button class="link-btn" id="btn-reset-best" type="button">ベストスコアを けす</button>
      </div>
    </div>

    <!-- ポーズ -->
    <div class="overlay" id="screen-pause" role="dialog" aria-modal="true" aria-label="ポーズ">
      <div class="panel">
        <h2 class="ribbon">ポーズ</h2>
        <button class="btn btn-pink btn-big" data-action="resume" type="button">つづける</button>
        <div class="icon-row" id="pause-icons"></div>
      </div>
    </div>

    <!-- おしまい -->
    <div class="overlay" id="screen-over" role="dialog" aria-modal="true" aria-label="おしまい">
      <div class="panel">
        <h2 class="ribbon">おしまい</h2>
        <span class="over-friend"><img id="over-friend" alt="" /></span>
        <span class="over-name" id="over-name"></span>
        <strong class="over-score" id="over-score">0</strong>
        <span class="chip best-chip" id="over-best"><span>ベスト</span><b id="over-best-value">0</b></span>
        <span class="new-best" id="over-newbest" hidden>ベスト こうしん!</span>
        <div class="stack">
          <button class="btn btn-pink btn-big" data-action="restart" type="button">もういちど</button>
          <button class="btn" data-action="title" type="button">タイトルへ</button>
        </div>
      </div>
    </div>

    <!-- とくぎ かくにん -->
    <div class="overlay" id="screen-ability" role="dialog" aria-modal="true" aria-labelledby="ability-title">
      <div class="panel">
        <h2 class="ribbon" id="ability-title"></h2>
        <div class="ability-hero">
          <span class="hero-icon" id="ability-icon"></span>
          <div class="charge">
            <span class="gems" id="ability-gems"></span>
            <span class="mini-meter"><i id="ability-meter"></i></span>
          </div>
        </div>
        <p class="ability-desc" id="ability-desc"></p>
        <div class="picker" id="picker" hidden></div>
        <div class="row">
          <button class="btn" data-action="back" type="button">やめる</button>
          <button class="btn btn-pink" id="ability-use" type="button" data-autofocus>つかう</button>
        </div>
      </div>
    </div>

    <!-- かくにん -->
    <div class="overlay" id="screen-confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
      <div class="panel panel-small">
        <p class="confirm-text" id="confirm-text"></p>
        <div class="row">
          <button class="btn" data-action="back" type="button">やめる</button>
          <button class="btn btn-pink" id="confirm-ok" type="button">はい</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
